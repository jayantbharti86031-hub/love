<!DOCTYPE html>
<html lang="hi">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sirf Tumhare Liye 💌</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link
            href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="surprise.css">
    </head>

    <body>

        <div id="stars" aria-hidden="true"></div>
        <div id="petals" aria-hidden="true"></div>
        <div id="fx" aria-hidden="true"></div>
        <div class="flash" id="flash" aria-hidden="true"></div>

        <main class="stage">

            <!-- 1) Shining text -->
            <h1 class="intro" id="intro">
                Ek chhota sa surprise...<br>
                <span>sirf tumhare liye ✨</span>
            </h1>

            <!-- 2) Heart draws itself -->
            <svg class="heart-draw" id="heartDraw" viewBox="-5 -5 110 100" aria-hidden="true">
                <defs>
                    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#ff9ab0" />
                        <stop offset="100%" stop-color="#ff0a54" />
                    </linearGradient>
                </defs>
                <path pathLength="1"
                    d="M50 85 C 10 55, 0 30, 18 14 C 32 2, 46 10, 50 24 C 54 10, 68 2, 82 14 C 100 30, 90 55, 50 85 Z"
                    fill="url(#hg)" stroke="url(#hg)" stroke-width="2.5" stroke-linejoin="round" />
            </svg>

            <!-- 3) Envelope -->
            <div class="envelope-wrap" id="envWrap">
                <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Envelope kholo">
                    <div class="env-back"></div>
                    <div class="heart-out" id="heartOut"><span>❤️</span></div>
                    <div class="env-front"></div>
                    <div class="env-flap"></div>
                    <div class="seal">💗</div>
                </div>
                <p class="hint" id="hint">Envelope par tap karo 💌</p>
            </div>

            <!-- 4) Letter -->
            <section class="letter" id="letter">
                <p class="text"><span id="typed"></span><span class="cursor"></span><span id="ghost"></span></p>
                <button class="btn" id="forgiveBtn"> Click Here Betuu💖</button>
            </section>

        </main>

        <script src="surprise.js"></script>
    </body>

</html>
